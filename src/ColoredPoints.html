<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>JC asgn 1</title>
    <style>
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 15px;
      }
      .controls {
        margin-top: 15px;
      }
    </style>
  </head>

  <body onload="main()">
    <p> added brush feature that fills gaps during mouse dragging and uses alpha for transparency effects</p>
    <canvas id="webgl" width="400" height="400">
    Please use a browser that supports "canvas"
    </canvas>
    <p id="numdot"> XXX </p>
    <button type = "button" id = "drawCustomButton">Draw Capybara</button>
    <div class="controls">
      Drawing Mode:
      <div class="row">
        <button type = "button" id = "pointButton">Point</button>
        <button type = "button" id = "triButton">Triangle</button>
        <button type = "button" id = "circleButton">Circle</button>
        <button type = "button" id = "brushButton">Brush</button>
      </div>
      Shape Color:  
      <div class="row">
        Red: <input type="range" id="redSlider" min="0" max="255" value="255">
        <div class="slider-value" id="redValue">255</div>

        Green: <input type="range" id="greenSlider" min="0" max="255" value="0">
        <div class="slider-value" id="greenValue">0</div>

        Blue: <input type="range" id="blueSlider" min="0" max="255" value="0">
        <div class="slider-value" id="blueValue">0</div>
        Color: <div id="colorPreview" style="width: 20px; height: 20px; border: 1px solid black; display: inline-block;"></div>
      </div>
      <div class="row">
        Shape Size: <input type="range" id="sizeSlider" min="5" max="40" value="10">
        <div class="slider-value" id="sizeValue">10</div> pixels
      </div>
      <div class="row">
        (Circles) Segment Count: <input type="range" id="segmentSlider" min="3" max="30" value="10">
        <div class="slider-value" id="segmentValue">10</div> segments
      </div>
      <div class="row">
        (Brush) Transparency: <input type="range" id="alphaSlider" min="0.1" max="1" value="0.7" step="0.1">
        <div class="slider-value" id="alphaValue">0.7</div>
      </div>
      <div class="row"> <button id="clearButton">Clear Canvas</button> </div>
    </div>
    <img src="IMG_9998.jpg" alt="Capybara reference image" width="400" />


    <script src="../lib/webgl-utils.js"></script>
    <script src="../lib/webgl-debug.js"></script>
    <script src="../lib/cuon-utils.js"></script>
    <script src="ColoredPoints.js"></script>
    <script src="Point.js"></script>
    <script src="Triangle.js"></script>
    <script src="Circle.js"></script>
    <script src="CustomDrawing.js"></script>
    <script src="Brush.js"></script>
  </body>
</html>
